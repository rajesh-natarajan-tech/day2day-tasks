services:
  dns:
    build: .
    image: home-lab-dns:latest
    container_name: home-lab-dns
    hostname: ns1.home.lab.com
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      # Mounted read-only so zone edits only need: docker compose restart
      - ./config/named.conf:/etc/bind/named.conf:ro
      - ./config/db.home.lab.com:/etc/bind/zones/db.home.lab.com:ro
      - ./config/db.192.168.56:/etc/bind/zones/db.192.168.56:ro
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 ns1.home.lab.com +short | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
